name: Verify Kodbox plugins
on:
  pull_request:
    paths:
      - 'assetLedger/**'
      - 'aiRagLite/**'
      - '.github/workflows/test-plugins.yml'
  push:
    branches: [main]
    paths:
      - 'assetLedger/**'
      - 'aiRagLite/**'
      - '.github/workflows/test-plugins.yml'
permissions:
  contents: read
jobs:
  lint-and-store-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          set -eu
          find assetLedger aiRagLite -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JS syntax
        run: |
          set -eu
          find assetLedger aiRagLite -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Live AssetLedger query adapter tests
        run: php aiRagLite/tests/test_asset_query.php
      - name: AI writer storage tests
        run: php aiRagLite/tests/test_writer.php
      - name: AI writer UI interaction tests
        run: |
          npm install --no-save --no-package-lock jsdom@24 jquery@3
          node aiRagLite/tests/test_writer_ui.cjs
      - name: RAG writer Python syntax
        run: python3 -m py_compile integrations/rag-writer/service/rag/drafting.py
      - name: Asset store tests
        run: php assetLedger/tests/test_store.php
      - name: Relation consistency regression tests
        run: php assetLedger/tests/test_relations.php
      - name: Wallos configuration tests
        run: php assetLedger/tests/test_wallos_config.php
      - name: Asset form UI contract tests
        run: python3 assetLedger/tests/test_ui_contract.py
