name: Publish Kodbox plugin releases

on:
  push:
    branches: [main]
    paths:
      - 'assetLedger/**'
      - 'aiRagLite/**'
      - 'tools/package_plugin.py'
      - '.github/workflows/publish-plugin-releases.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plugin-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [assetLedger, aiRagLite]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package plugin ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          plugin="${{ matrix.plugin }}"
          version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["version"])' "$plugin/package.json")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid plugin version: $version" >&2
            exit 1
          fi
          tag="${plugin}-v${version}"
          archive="${tag}.zip"
          python3 tools/package_plugin.py "$plugin" "dist/$archive"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Create or complete GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${{ steps.package.outputs.tag }}"
          archive="${{ steps.package.outputs.archive }}"
          file="dist/$archive"
          if gh release view "$tag" >/dev/null 2>&1; then
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$archive"; then
              echo "Release $tag already contains $archive; not overwriting published version."
              exit 0
            fi
            echo "Existing release $tag is missing the ZIP; uploading it."
            gh release upload "$tag" "$file"
          else
            gh release create "$tag" "$file" \
              --target "$GITHUB_SHA" \
              --title "${{ matrix.plugin }} v${tag##*-v}" \
              --notes "Kodbox plugin installation package. Download the ZIP and extract its top-level plugin folder directly into your Kodbox program's plugins/ directory. This archive contains program files only; no personal inventory or credentials."
          fi
