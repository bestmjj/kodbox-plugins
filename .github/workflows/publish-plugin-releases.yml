name: Publish Kodbox plugin releases

on:
  push:
    branches: [main]
    paths:
      - 'assetLedger/**'
      - 'aiRagLite/**'
      - 'tools/package_plugin.py'
      - '.github/workflows/publish-plugin-releases.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plugin-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [assetLedger, aiRagLite]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package plugin ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          plugin="${{ matrix.plugin }}"
          version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["version"])' "$plugin/package.json")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid plugin version: $version" >&2
            exit 1
          fi
          tag="${plugin}-v${version}"
          archive="${tag}.zip"
          python3 tools/package_plugin.py "$plugin" "dist/$archive"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Package aiRagLite RAG writer companion ZIP
        if: matrix.plugin == 'aiRagLite'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          version = json.loads(Path('aiRagLite/package.json').read_text(encoding='utf-8'))['version']
          src = Path('integrations/rag-writer')
          out = Path('dist') / f'aiRagLite-v{version}-rag-writer.zip'
          included = ['README.md', 'install.sh', 'service/rag/drafting.py']
          with ZipFile(out, 'w', compression=ZIP_DEFLATED) as z:
              for name in included:
                  path = src / name
                  if not path.is_file():
                      raise FileNotFoundError(path)
                  z.write(path, name)
          with ZipFile(out) as z:
              assert z.testzip() is None
          print(f'Built companion: {out}')
          PY
      - name: Create or complete GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${{ steps.package.outputs.tag }}"
          archive="${{ steps.package.outputs.archive }}"
          file="dist/$archive"
          companion=""
          if [[ "${{ matrix.plugin }}" == "aiRagLite" ]]; then
            companion="dist/${tag}-rag-writer.zip"
            test -f "$companion"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            existing="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            if ! grep -Fxq "$archive" <<< "$existing"; then
              gh release upload "$tag" "$file"
            else
              echo "Plugin ZIP already released: $archive"
            fi
            if [[ -n "$companion" ]] && ! grep -Fxq "${companion##*/}" <<< "$existing"; then
              gh release upload "$tag" "$companion"
            fi
          else
            assets=("$file")
            if [[ -n "$companion" ]]; then assets+=("$companion"); fi
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "${{ matrix.plugin }} v${tag##*-v}" \
              --notes "Kodbox plugin installation package. The aiRagLite RAG writer requires both the plugin ZIP and the companion RAG writer ZIP, plus a rebuild of rag-api. No credentials or personal data included."
          fi
